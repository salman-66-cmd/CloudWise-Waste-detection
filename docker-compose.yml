version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cloudwise-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cloudwise}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudwise"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudwise-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudwise-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cloudwise}
      SECRET_KEY: ${SECRET_KEY:-cloudwise_super_secret_jwt_key_2026_dev_mode_change_in_prod}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ENABLED: ${AWS_ENABLED:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - cloudwise-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudwise-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cloudwise-network

networks:
  cloudwise-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
